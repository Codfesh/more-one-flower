<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>渲染自检</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05080c}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #game{display:block;touch-action:none;background:#0a1018}
</style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="1920" height="1080"></canvas></div>
  <script src="../game.js"></script>
  <script>
  /* 用真实浏览器 + 真实 Canvas 像素，量化验证渲染结果（模型无法看图时的替代验证） */
  var cv, ctx2, W, H, SC, api;
  function px() { return ctx2.getImageData(0, 0, W, H).data; }

  /** 统计某逻辑区域内的像素特征 */
  function region(d, lx, ly, lw, lh) {
    var x0 = Math.max(0, Math.round(lx * SC)), y0 = Math.max(0, Math.round(ly * SC));
    var x1 = Math.min(W, Math.round((lx + lw) * SC)), y1 = Math.min(H, Math.round((ly + lh) * SC));
    var t = 0, bright = 0, amber = 0, red = 0, yellow = 0, white = 0, purple = 0, green = 0, blue = 0;
    for (var y = y0; y < y1; y += 2) {
      for (var x = x0; x < x1; x += 2) {
        var i = (y * W + x) * 4, r = d[i], g = d[i + 1], b = d[i + 2];
        t++;
        if (Math.max(r, g, b) > 60) bright++;
        if (r > 150 && r - b > 60 && g > 90) amber++;
        if (r > 150 && g < 110 && b < 110) red++;
        if (r > 205 && g > 165 && b < 140) yellow++;
        if (r > 225 && g > 225 && b > 225) white++;
        if (r > 80 && b > 120 && b - g > 40) purple++;
        if (g > 110 && g - r > 40 && g - b > 30) green++;
        if (b > 140 && b - r > 50) blue++;
      }
    }
    return {
      n: t, bright: +(bright / t).toFixed(3), amber: +(amber / t).toFixed(3),
      red: +(red / t).toFixed(3), yellow: +(yellow / t).toFixed(3),
      white: +(white / t).toFixed(3), purple: +(purple / t).toFixed(3),
      green: +(green / t).toFixed(3), blue: +(blue / t).toFixed(3)
    };
  }
  function full(d) { return region(d, 0, 0, 1920, 1080); }

  function settle() {                       // 若有升级弹窗，先选掉，确保采样到"游戏中"的画面
    for (var i = 0; i < 20; i++) {
      var s = window.__BEE__.state();
      if (s.mode === 'over') { api.startRun(); api.step(1 / 60); continue; }
      if (s.mode !== 'levelup') return;
      api.choose(0);
      api.step(1 / 60);
    }
  }

  function report(text) {
    var old = document.getElementById('diag');
    if (old) old.parentNode.removeChild(old);
    var pre = document.createElement('pre');
    pre.id = 'diag';
    pre.textContent = 'DIAG_JSON=' + text + '=END_DIAG';
    document.body.appendChild(pre);
  }
  window.onerror = function (msg, src, line, col, err) {
    report('{"error":' + JSON.stringify(String(msg) + ' @' + line + ':' + col + ' ' + (err && err.stack ? err.stack : '')) + '}');
  };

  setTimeout(function () {
   try {
    cv = document.getElementById('game');
    ctx2 = cv.getContext('2d');
    W = cv.width; H = cv.height; SC = W / 1920;
    api = window.__BEE__.api;
    var out = { canvas: W + 'x' + H, checks: {} };
    settle();

    /* --- A. 常态：一局游戏进行中 --- */
    var d = px(), st = window.__BEE__.state();
    var cam0 = api.camera();
    out.state = { mode: st.mode, gameType: st.gameType, phase: st.phase, honey: Math.round(st.honey), cap: st.cap,
                  returns: st.returns, score: st.score, flowers: st.flowers, wasps: st.wasps,
                  lives: st.lives, aliveT: +st.aliveT.toFixed(1), winter: st.winter, store: st.store, quota: st.quota };
    out.checks.world = full(d);
    /* 冬季模式的目标面板 */
    if (st.gameType === 'winter') { out.checks.winterPanel = region(d, 580, 20, 760, 96); }
    out.checks.hudPanel = region(d, 28, 24, 566, 204);
    out.checks.honeyBar = region(d, 52, 48, 400, 30);
    out.checks.scorePanel = region(d, 1490, 24, 402, 168);
    out.checks.minimap = region(d, 28, 816, 330, 236);
    out.checks.hintText = region(d, 1000, 980, 880, 80);
    out.checks.threatPanel = region(d, 1490, 204, 402, 54);
    out.hudRowEnd = st.hudRowEnd;                 // 状态行末尾 x：必须不超出左侧面板右边缘(648)
    out.hudRowFits = st.hudRowEnd > 0 && st.hudRowEnd <= 648;
    out.fitWarnCount = st.fitWarnCount;           // 排版告警：>0 说明有文字被迫缩号 / 截断
    out.fitWarnings = st.fitWarnings;
    out.checks.comboMeter = region(d, st.bee.x - cam0.x + 960 - 120, st.bee.y - cam0.y + 540 - 130, 240, 150);
    var hv = api.hive();
    out.hiveWorld = { x: hv.x, y: hv.y };
    out.checks.hive = region(d, hv.x - cam0.x + 960 - 130, hv.y - cam0.y + 540 - 130, 260, 260);
    out.edgeBaseline = {
      left: region(d, 0, 0, 70, 1080), top: region(d, 0, 0, 1920, 70),
      right: region(d, 1850, 0, 70, 1080), bottom: region(d, 0, 1010, 1920, 70)
    };

    /* --- B. 毒花：暗紫 + 骷髅标记 --- */
    var pf = api.forceFlower('poison');
    api.setPos(pf.x + 200, pf.y);
    for (var i = 0; i < 60; i++) api.step(1 / 60);
    settle();
    d = px();
    var camB = api.camera();
    var pSX = pf.x - camB.x + 960, pSY = pf.y - camB.y + 540;
    out.poisonOnScreen = pSX > 0 && pSX < 1920 && pSY > 0 && pSY < 1080;
    out.checks.poisonFlower = region(d, pSX - 70, pSY - 70, 140, 140);
    out.checks.worldWithPoison = full(d);

    /* --- C. 金花：光柱 + 金光 --- */
    var gf = api.forceFlower('gold');
    api.setPos(gf.x + 200, gf.y);
    for (var j = 0; j < 60; j++) api.step(1 / 60);
    settle();
    d = px();
    var cam2 = api.camera();
    var gSX = gf.x - cam2.x + 960, gSY = gf.y - cam2.y + 540;
    out.goldOnScreen = gSX > 0 && gSX < 1920 && gSY > 0 && gSY < 1080;
    out.checks.goldPillar = region(d, gSX - 80, gSY - 300, 160, 320);
    out.checks.goldCore = region(d, gSX - 60, gSY - 60, 120, 120);

    /* --- D. 满载：屏幕边缘橙色暗角 --- */
    api.setHoney(window.__BEE__.state().cap);
    for (var k = 0; k < 6; k++) api.step(1 / 60);
    d = px();
    out.checks.fullEdges = {
      left: region(d, 0, 0, 70, 1080), top: region(d, 0, 0, 1920, 70),
      right: region(d, 1850, 0, 70, 1080), bottom: region(d, 0, 1010, 1920, 70)
    };

    /* --- E. 升级三选一界面 --- */
    api.levelUp();
    api.step(1 / 60);
    d = px();
    var stD = window.__BEE__.state();
    out.stateD = { mode: stD.mode, choices: stD.choices };
    out.checks.levelUpCards = region(d, 340, 400, 400, 320);
    out.checks.levelUpTitle = region(d, 760, 200, 400, 140);

    /* --- F. 结算界面 --- */
    api.choose(0);
    for (var q = 0; q < 30; q++) api.kill();
    for (var m = 0; m < 90; m++) api.step(1 / 60);
    d = px();
    var stE = window.__BEE__.state();
    out.stateE = { mode: stE.mode, rating: stE.result && stE.result.rating };
    out.checks.gameOverPanel = region(d, 490, 130, 940, 700);

    /* --- G. 模式选择页（重新加载前的标题态无法回退，这里只检查当前是否正常） --- */
    /* --- G. 全部升级卡片的排版检查（用户反馈：诱饵 / 过载蜜囊 的字出框） --- */
    var cards = api.measureCards();
    out.cards = cards;
    out.cardsAllFit = cards.every(function (c) { return c.nameFits && c.descFits && c.tagFits; });
    out.cardsBad = cards.filter(function (c) { return !(c.nameFits && c.descFits && c.tagFits); })
      .map(function (c) { return c.id + '(name' + c.nameSize + ',lines' + c.descLines + ',w' + c.descMaxW + ')'; });

    report(JSON.stringify(out));
   } catch (e) {
    report('{"error":' + JSON.stringify(String(e && e.stack ? e.stack : e)) + '}');
   }
  }, 3000);
  </script>
</body>
</html>
